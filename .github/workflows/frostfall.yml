name: Frostfall

on:
  push:
    paths: ['frostfall/**', '.github/workflows/frostfall.yml']
  pull_request:
    paths: ['frostfall/**', '.github/workflows/frostfall.yml']

# a newer push to the same branch makes the older run pointless
concurrency:
  group: frostfall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frostfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frostfall/package-lock.json
      - run: npm ci
      # fails on errors only; warnings (unused variables) are listed but do not fail the build
      - name: ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frostfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frostfall/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests (pure logic, no browser)
        run: node test/unit/unit.mjs
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      # every stage test except the long bots (job below), 4 files at a time; a file that fails once and then passes is
      # reported as FLAKY and does not fail the job
      - name: Browser tests (every stage, WebGL smoke test, perf)
        run: node test/run.mjs --fast --skip=unit/unit --jobs=4 --timeout=15
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frostfall-screenshots
          path: frostfall/test/out
          if-no-files-found: ignore

  long:
    # campaign bot, arena soak and the other long runs, in parallel with the job above
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frostfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frostfall/package-lock.json
      - run: npm ci
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Long bots and soak tests
        run: node test/run.mjs --long --jobs=3
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frostfall-screenshots-long
          path: frostfall/test/out
          if-no-files-found: ignore

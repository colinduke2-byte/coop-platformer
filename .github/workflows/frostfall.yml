name: Frostfall

on:
  push:
    paths: ['frostfall/**', '.github/workflows/frostfall.yml']
  pull_request:
    paths: ['frostfall/**', '.github/workflows/frostfall.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frostfall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frostfall/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests (pure logic, no browser)
        run: node test/unit/unit.mjs
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (every stage, WebGL smoke test)
        run: npm test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frostfall-screenshots
          path: frostfall/test/out
          if-no-files-found: ignore

name: Frostfall - publish playable site

# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# After that every push to main (or a manual run) publishes the game at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
    paths: ['frostfall/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frostfall/package-lock.json
      - run: npm ci
        working-directory: frostfall
      - run: npm run build
        working-directory: frostfall
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frostfall/dist
      - id: deployment
        uses: actions/deploy-pages@v4
